# Dream Arena (T-060).
#
# Three services, matching the three processes the system actually runs. Keys
# come from .env and are never baked into an image. The agent serves the API and
# WebSocket, so the web service depends on it.
services:
  agent:
    build: { context: ., dockerfile: Dockerfile.agent }
    command: ["npm", "run", "agent"]
    env_file: [.env]
    environment:
      VENUE_MODE: ${VENUE_MODE:-LIVE}
      API_PORT: "8080"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["8080:8080"]
    volumes: ["./state:/repo/state"]      # journals survive the container
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  echo:
    build: { context: ., dockerfile: Dockerfile.agent }
    command: ["npm", "run", "echo"]
    env_file: [.env]
    environment:
      VENUE_MODE: ${VENUE_MODE:-LIVE}
    depends_on:
      agent: { condition: service_healthy }
    volumes: ["./state:/repo/state"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
    ports: ["3000:3000"]
    depends_on:
      agent: { condition: service_healthy }
